<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AP1 - 交互式二维分形（WebGL2 版）</title>
  <style>
    html, body { margin:0; width:100%; height:100%; overflow:hidden; font-family:system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; background: linear-gradient(180deg,#071122,#07111a); color:#e6eef8; }
    canvas { display:block; width:100vw; height:100vh; cursor:grab; }
    canvas.dragging { cursor:grabbing; }
    .ui { position:fixed; left:16px; top:16px; width:min(320px, calc(100vw - 32px)); padding:12px; border-radius:10px; background:rgba(10,18,28,0.72); border:1px solid rgba(255,255,255,0.06); }
    label { display:block; font-size:12px; color:#bcd3ee; margin-bottom:6px; }
    select, input[type=range], button { width:100%; margin-bottom:8px; box-sizing:border-box; }
    select, button { background:rgba(255,255,255,0.04); color:#eef6ff; border:1px solid rgba(255,255,255,0.12); border-radius:8px; padding:7px 9px; }
    .status { font-size:12px; color:#9fbbe3; margin-top:6px; }
    .small { font-size:11px; color:#86a9d0; }
  </style>
</head>
<body>
  <canvas id="gl-canvas"></canvas>

  <div class="ui">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <strong>AP1 分形（WebGL2）</strong>
      <span class="small">initShaders.js</span>
    </div>

    <label>算法
      <select id="sourceSelect">
        <option value="chaos">混沌游戏（3角）</option>
        <option value="chaos-penta">混沌游戏（5边）</option>
        <option value="chaos-hexa">混沌游戏（6边）</option>
        <option value="fractal">递归细分（Sierpinski）</option>
      </select>
    </label>

    <label>渲染模式
      <select id="modeSelect">
        <option value="points">点（POINTS）</option>
        <option value="lines">线（LINES）</option>
        <option value="triangles">面（TRIANGLES）</option>
      </select>
    </label>

    <label>递归深度
      <input id="depthRange" type="range" min="0" max="6" step="1" value="4" />
    </label>

    <label>点数（混沌）
      <input id="countRange" type="range" min="1000" max="100000" step="1000" value="5000" />
    </label>

    <label>点大小
      <input id="sizeRange" type="range" min="1" max="18" step="1" value="3" />
    </label>

    <label>配色
      <select id="paletteSelect">
        <option value="0">橙色</option>
        <option value="1">蓝色</option>
        <option value="2">紫色</option>
      </select>
    </label>

    <button id="generateBtn">重新生成</button>

    <div class="status">
      <div>键盘：1 / 2 / 3 切换模式，空格暂停/继续生长</div>
      <div>鼠标：拖拽平移，滚轮缩放</div>
      <div id="statusText" class="small">就绪</div>
    </div>
  </div>

  <!-- WebGL2 着色器：注意 #version 300 es 和 in/out -->
  <script id="vshader" type="x-shader/x-vertex">
    #version 300 es
    precision mediump float;
    in vec2 a_Position;
    uniform vec2 u_Pan;
    uniform float u_Zoom;
    uniform float u_PointSize;
    void main() {
      vec2 p = (a_Position + u_Pan) * u_Zoom;
      gl_Position = vec4(p, 0.0, 1.0);
      gl_PointSize = u_PointSize;
    }
  </script>

  <script id="fshader" type="x-shader/x-fragment">
    #version 300 es
    precision mediump float;
    uniform vec3 u_Color;
    out vec4 fragColor;
    void main() {
      fragColor = vec4(u_Color, 1.0);
    }
  </script>

  <script src="./initShaders.js"></script>

  <script>
    (function () {
      const canvas = document.getElementById('gl-canvas');
      // 强制使用 WebGL2
      const gl = canvas.getContext('webgl2');
      if (!gl) {
        alert('需要 WebGL2（你的浏览器或设备不支持）。');
        return;
      }

      // UI 元素
      const sourceSelect = document.getElementById('sourceSelect');
      const modeSelect = document.getElementById('modeSelect');
      const depthRange = document.getElementById('depthRange');
      const countRange = document.getElementById('countRange');
      const sizeRange = document.getElementById('sizeRange');
      const paletteSelect = document.getElementById('paletteSelect');
      const generateBtn = document.getElementById('generateBtn');
      const statusText = document.getElementById('statusText');

      const palettes = [
        [1.0, 0.45, 0.25],
        [0.45, 0.75, 1.0],
        [0.85, 0.42, 1.0]
      ];

      const state = {
        source: 'chaos',
        renderMode: 'points',
        depth: 4,
        pointCount: 5000,
        pointSize: 3,
        paletteIndex: 0,
        paused: false,
        currentChaosCount: 0,
        animationStep: 120,
        zoom: 1.0,
        panX: 0.0,
        panY: 0.0,
        dragging: false,
        lastMouse: { x: 0, y: 0 },
        chaosData: null,
        fractalData: null,
        chaosRatio: 0.5
      };

      // program
      const program = initShaders(gl, 'vshader', 'fshader');
      if (program === -1) { alert('着色器初始化失败'); return; }
      gl.useProgram(program);

      // attribute / uniform locations
      const a_Position = gl.getAttribLocation(program, 'a_Position');
      const u_Pan = gl.getUniformLocation(program, 'u_Pan');
      const u_Zoom = gl.getUniformLocation(program, 'u_Zoom');
      const u_PointSize = gl.getUniformLocation(program, 'u_PointSize');
      const u_Color = gl.getUniformLocation(program, 'u_Color');

      // Buffer helper: create and bind once (reuse)
      const buffers = {
        chaos: gl.createBuffer(),
        fractal: gl.createBuffer()
      };

      function updateArrayBuffer(buffer, data) {
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
        gl.bufferData(gl.ARRAY_BUFFER, data, gl.STATIC_DRAW);
        gl.enableVertexAttribArray(a_Position);
        gl.vertexAttribPointer(a_Position, 2, gl.FLOAT, false, 0, 0);
      }

      function resizeCanvas() {
        const dpr = window.devicePixelRatio || 1;
        const w = Math.floor(window.innerWidth * dpr);
        const h = Math.floor(window.innerHeight * dpr);
        if (canvas.width !== w || canvas.height !== h) {
          canvas.width = w;
          canvas.height = h;
          canvas.style.width = window.innerWidth + 'px';
          canvas.style.height = window.innerHeight + 'px';
          gl.viewport(0, 0, w, h);
        }
      }
      window.addEventListener('resize', resizeCanvas);

      // helpers
      function randBetween(min, max) { return min + Math.random() * (max - min); }
      function midpoint(a,b) { return [(a[0]+b[0])*0.5, (a[1]+b[1])*0.5]; }
      function createNGonVertices(n, radius=0.8) {
        const verts = [];
        for (let i=0;i<n;i++){
          const angle = 2*Math.PI*i/n - Math.PI/2;
          verts.push([radius*Math.cos(angle), radius*Math.sin(angle)]);
        }
        return verts;
      }

      // Chaos game
      function generateChaosPoints(count, vertices, ratio=0.5) {
        const out = new Float32Array(count * 2);
        let p = [randBetween(-1,1), randBetween(-1,1)];
        for (let i=0;i<count;i++){
          const v = vertices[Math.floor(Math.random()*vertices.length)];
          p = [ p[0]*(1-ratio) + v[0]*ratio, p[1]*(1-ratio) + v[1]*ratio ];
          out[2*i] = p[0];
          out[2*i+1] = p[1];
        }
        return out;
      }

      // Recursive subdivide (Sierpinski: do NOT recurse center)
      function generateFractal(depth) {
        const tri = [ [-0.7,-0.55], [0.7,-0.55], [0.0,0.85] ];
        const data = { points: [], lines: [], triangles: [] };

        function emitBase(a,b,c) {
          data.points.push(a[0],a[1], b[0],b[1], c[0],c[1]);
          data.lines.push(a[0],a[1], b[0],b[1]);
          data.lines.push(b[0],b[1], c[0],c[1]);
          data.lines.push(c[0],c[1], a[0],a[1]);
          data.triangles.push(a[0],a[1], b[0],b[1], c[0],c[1]);
        }

        function subdiv(a,b,c,d) {
          if (d===0) { emitBase(a,b,c); return; }
          const ab = midpoint(a,b), bc = midpoint(b,c), ca = midpoint(c,a);
          subdiv(a, ab, ca, d-1);
          subdiv(ab, b, bc, d-1);
          subdiv(ca, bc, c, d-1);
        }

        subdiv(tri[0], tri[1], tri[2], depth);
        return {
          points: new Float32Array(data.points),
          lines: new Float32Array(data.lines),
          triangles: new Float32Array(data.triangles)
        };
      }

      // rebuild data
      function rebuildChaos() {
        let vertices;
        if (state.source === 'chaos-penta') {
          vertices = createNGonVertices(5);
          state.chaosRatio = 0.618;
        } else if (state.source === 'chaos-hexa') {
          vertices = createNGonVertices(6);
          state.chaosRatio = 0.667;
        } else {
          vertices = [ [-0.8,-0.7], [0.8,-0.7], [0.0,0.85] ];
          state.chaosRatio = 0.5;
        }
        state.chaosData = generateChaosPoints(state.pointCount, vertices, state.chaosRatio);
        state.currentChaosCount = 0;
        // prepare buffer
        updateArrayBuffer(buffers.chaos, state.chaosData);
      }

      function rebuildFractal() {
        state.fractalData = generateFractal(state.depth);
        // We will update buffers when drawing fractal
        // but pre-upload triangles (as default)
        updateArrayBuffer(buffers.fractal, state.fractalData.triangles);
      }

      function regenerateAll() {
        rebuildChaos();
        rebuildFractal();
        updateStatus();
      }

      // draw
      function drawChaos() {
        if (!state.chaosData) return;
        const count = Math.min(state.currentChaosCount, state.pointCount);
        if (count <= 0) return;
        // chaos: only points (prevent messy lines)
        gl.bindBuffer(gl.ARRAY_BUFFER, buffers.chaos);
        gl.enableVertexAttribArray(a_Position);
        gl.vertexAttribPointer(a_Position, 2, gl.FLOAT, false, 0, 0);
        gl.drawArrays(gl.POINTS, 0, count);
      }

      function drawFractal() {
        if (!state.fractalData) return;
        let data, mode, count;
        if (state.renderMode === 'points') {
          data = state.fractalData.points; mode = gl.POINTS; count = data.length/2;
        } else if (state.renderMode === 'lines') {
          data = state.fractalData.lines; mode = gl.LINES; count = data.length/2;
        } else {
          data = state.fractalData.triangles; mode = gl.TRIANGLES; count = data.length/2;
        }
        // upload selected data to fractal buffer and draw
        updateArrayBuffer(buffers.fractal, data);
        gl.drawArrays(mode, 0, count);
      }

      function renderLoop() {
        resizeCanvas();
        if (!state.paused && state.source.startsWith('chaos')) {
          state.currentChaosCount = Math.min(state.pointCount, state.currentChaosCount + state.animationStep);
        }
        gl.clearColor(0.06,0.09,0.12,1.0);
        gl.clear(gl.COLOR_BUFFER_BIT);

        gl.uniform2f(u_Pan, state.panX, state.panY);
        gl.uniform1f(u_Zoom, state.zoom);
        gl.uniform1f(u_PointSize, state.pointSize);
        const p = palettes[state.paletteIndex];
        gl.uniform3f(u_Color, p[0], p[1], p[2]);

        if (state.source.startsWith('chaos')) drawChaos(); else drawFractal();
        requestAnimationFrame(renderLoop);
      }

      // interaction
      canvas.addEventListener('mousedown', (e) => {
        state.dragging = true; canvas.classList.add('dragging');
        state.lastMouse.x = e.clientX; state.lastMouse.y = e.clientY;
      });
      window.addEventListener('mouseup', () => { state.dragging = false; canvas.classList.remove('dragging'); });
      window.addEventListener('mousemove', (e) => {
        if (!state.dragging) return;
        const dx = e.clientX - state.lastMouse.x, dy = e.clientY - state.lastMouse.y;
        state.panX += dx * 0.002 / state.zoom; state.panY -= dy * 0.002 / state.zoom;
        state.lastMouse.x = e.clientX; state.lastMouse.y = e.clientY;
      });
      canvas.addEventListener('wheel', (e) => { e.preventDefault(); const f = Math.exp(-e.deltaY * 0.0012); state.zoom *= f; state.zoom = Math.max(0.2, Math.min(8.0, state.zoom)); }, { passive:false });
      window.addEventListener('keydown', (e) => {
        if (e.key === '1') { state.renderMode = 'points'; modeSelect.value='points'; }
        else if (e.key === '2') { state.renderMode = 'lines'; modeSelect.value='lines'; }
        else if (e.key === '3') { state.renderMode = 'triangles'; modeSelect.value='triangles'; }
        else if (e.code === 'Space') { e.preventDefault(); state.paused = !state.paused; }
        updateStatus();
      });

      // UI handlers
      sourceSelect.addEventListener('change', (e) => {
        state.source = e.target.value;
        if (state.source.startsWith('chaos')) {
          // chaos only points
          state.renderMode = 'points'; modeSelect.value = 'points';
          modeSelect.options[1].disabled = true; modeSelect.options[2].disabled = true;
          rebuildChaos();
        } else {
          modeSelect.options[1].disabled = false; modeSelect.options[2].disabled = false;
          rebuildFractal();
        }
        updateStatus();
      });
      modeSelect.addEventListener('change', (e) => { state.renderMode = e.target.value; updateStatus(); });
      depthRange.addEventListener('input', (e) => { state.depth = Number(e.target.value); if (state.source === 'fractal') rebuildFractal(); updateStatus(); });
      countRange.addEventListener('input', (e) => { state.pointCount = Number(e.target.value); if (state.source.startsWith('chaos')) rebuildChaos(); updateStatus(); });
      sizeRange.addEventListener('input', (e) => { state.pointSize = Number(e.target.value); updateStatus(); });
      paletteSelect.addEventListener('change', (e) => { state.paletteIndex = Number(e.target.value); updateStatus(); });
      generateBtn.addEventListener('click', () => regenerateAll());

      function updateStatus() {
        let base = '混沌（3角）';
        if (state.source === 'chaos-penta') base = '混沌（5边）';
        else if (state.source === 'chaos-hexa') base = '混沌（6边）';
        else if (state.source === 'fractal') base = '递归细分（Sierpinski）';
        const kind = state.renderMode === 'points' ? '点' : (state.renderMode === 'lines' ? '线' : '面');
        statusText.textContent = `${base} • ${kind} • 深度=${state.depth} • 点数=${state.pointCount}`;
      }

      function init() {
        resizeCanvas();
        sourceSelect.value = state.source; modeSelect.value = state.renderMode;
        depthRange.value = String(state.depth); countRange.value = String(state.pointCount);
        sizeRange.value = String(state.pointSize); paletteSelect.value = String(state.paletteIndex);
        regenerateAll(); updateStatus(); requestAnimationFrame(renderLoop);
      }

      init();
    })();
  </script>
</body>
</html>
